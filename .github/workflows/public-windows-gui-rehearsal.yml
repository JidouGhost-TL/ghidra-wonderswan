name: Public Windows Ghidra GUI rehearsal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-gui:
    if: github.repository == 'JidouGhost-TL/ghidra-wonderswan' && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.12"
      - name: Rehearse the published GUI in the foreground
        shell: pwsh
        run: |
          $scratch = Join-Path $env:RUNNER_TEMP 'ghidra-public-gui'
          & './tools/release-rehearsal/gui/Run-NativeGui.ps1' -Output $scratch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
